version: "3.8"

services:
  ecostate:
    container_name: ecostate_api
    build:
      context: .
      dockerfile: EcoState/Dockerfile
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: ${ENV}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
      WeatherSettings__ApiKey: ${WEATHER_SETTING_API_KEY}
      WeatherSettings__BaseUrl: ${WEATHER_SETTING_BASE_URL}
      WeatherSettings__Units: ${WEATHER_SETTING_UNITS}
      AuthSettings__SecretKey: ${AUTH_SETTING_SECRET_KEY}
      AuthSettings__Expires: ${AUTH_SETTING_EXPIRES}
    networks:
      - test
  
  postgres:
    container_name: ecostate_db
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - test

networks:
  test:
    driver: bridge

volumes:
  db_data: